name: Update auction lists

on:
  schedule:
    - cron: "7 10 * * *"   # 6:07am New York (EDT)
    - cron: "7 22 * * *"   # 6:07pm New York (EDT)
  workflow_dispatch:
    inputs:
      force:
        description: "Re-read every PDF even if unchanged"
        type: boolean
        default: false
      photo_budget:
        description: "Max new photo lookups this run"
        default: "450"
      photo_test:
        description: "Only test photo picks, e.g. 2011|Volvo|XC90,2025|Nissan|Rogue (nothing is saved)"
        default: ""

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber==0.11.4
      - name: Test photo picks
        if: ${{ inputs.photo_test != '' && inputs.photo_test != null }}
        env:
          PHOTO_DEBUG: "1"
        run: python scripts/update.py --photo-test "${{ inputs.photo_test }}"
      - name: Pull lists and decode VINs
        if: ${{ !inputs.photo_test }}
        env:
          PHOTO_BUDGET: ${{ inputs.photo_budget || '450' }}
        run: python scripts/update.py ${{ inputs.force && '--force' || '' }}
      - name: Commit changes
        if: ${{ !inputs.photo_test }}
        run: |
          git config user.name "auction-bot"
          git config user.email "auction-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update auction lists"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
